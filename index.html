<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cangaço Bet - Fortune Tiger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            max-width: 500px;
        }
        .btn-voltar {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .saldo {
            font-weight: bold;
            color: #00ff88;
        }
        .game-container {
            background: #1e1e1e;
            border: 2px solid #ff4500;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.4);
        }
        .aposta-info {
            font-size: 16px;
            margin-bottom: 20px;
            color: #ccc;
        }
        .slots-grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .slot-box {
            width: 80px;
            height: 90px;
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .mensagem {
            font-size: 15px;
            margin-bottom: 20px;
            min-height: 24px;
            font-weight: bold;
        }
        .btn-girar {
            width: 100%;
            background: linear-gradient(to bottom, #ff7300, #ff4500);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.5);
            transition: 0.2s;
        }
        .btn-girar:active {
            transform: scale(0.98);
        }
        .footer-modo {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-voltar" onclick="alert('Voltando...')">← Voltar</button>
        <div style="font-size: 14px;">🐯 FORTUNE TIGER</div>
        <div class="saldo">Saldo: R$ <span id="saldo-val">99,50</span></div>
    </div>

    <div class="game-container">
        <div class="aposta-info">Aposta: R$ 2,00</div>
        
        <div class="slots-grid">
            <div class="slot-box" id="slot1">💰</div>
            <div class="slot-box" id="slot2">💰</div>
            <div class="slot-box" id="slot3">💰</div>
        </div>

        <div class="mensagem" id="mensagem">Você ganhou um prêmio baixo: R$ 1.50</div>

        <button class="btn-girar" id="btnGirar" onclick="girarJogo()">GIRAR 🎰</button>
        
        <div class="footer-modo">Modo Oficial Cangaço Bet</div>
    </div>

    <script>
        let saldo = 99.50;
        const custoAposta = 2.00;

        function girarJogo() {
            if (saldo < custoAposta) {
                alert("Saldo insuficiente!");
                return;
            }

            // Deduz o valor da aposta
            saldo -= custoAposta;
            document.getElementById("saldo-val").innerText = saldo.toFixed(2);

            const btn = document.getElementById("btnGirar");
            const msg = document.getElementById("mensagem");
            const s1 = document.getElementById("slot1");
            const s2 = document.getElementById("slot2");
            const s3 = document.getElementById("slot3");

            btn.disabled = true;
            msg.style.color = "#ccc";
            msg.innerText = "Girando...";
            s1.innerText = "🔄";
            s2.innerText = "🔄";
            s3.innerText = "🔄";

            setTimeout(() => {
                // PROBABILIDADES AJUSTADAS:
                // 85% de chance de perder (itens diferentes)
                // 15% de chance de ganhar um prêmio baixo
                let rand = Math.random();
                let icones = ["💰", "🍊", "🍋", "🍒", "⭐"];

                if (rand < 0.85) {
                    // Derrota (itens desalinhados)
                    s1.innerText = icones[Math.floor(Math.random() * icones.length)];
                    s2.innerText = icones[Math.floor(Math.random() * icones.length)];
                    s3.innerText = icones[Math.floor(Math.random() * icones.length)];
                    
                    // Garante que não fiquem iguais por acidente
                    if(s1.innerText === s2.innerText && s2.innerText === s3.innerText) {
                        s3.innerText = "❌";
                    }

                    msg.style.color = "#ff4444";
                    msg.innerText = "Não foi dessa vez! Tente novamente.";
                } else {
                    // Vitória com prêmio baixo (ex: R$ 0.50 a R$ 1.50)
                    let premioBaixo = (Math.random() * 1.0 + 0.5).toFixed(2);
                    let iconeSorteado = "💰"; // Ícone de ganho baixo
                    
                    s1.innerText = iconeSorteado;
                    s2.innerText = iconeSorteado;
                    s3.innerText = iconeSorteado;

                    saldo += parseFloat(premioBaixo);
                    document.getElementById("saldo-val").innerText = saldo.toFixed(2);

                    msg.style.color = "#00ff88";
                    msg.innerText = `Você ganhou um prêmio baixo: R$ ${premioBaixo}`;
                }

                btn.disabled = false;
            }, 1200);
        }
    </script>
</body>
</html>

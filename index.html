<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cangaço Bet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0614;
            color: #ffffff;
            padding-bottom: 90px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #170d2b;
            border-bottom: 2px solid #2d1654;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff6600;
        }
        .btn-entrar {
            background-color: #ff6600;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .audio-bar {
            background: linear-gradient(90deg, #b32d00, #ff6600);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-som {
            background: #fff;
            color: #b32d00;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu-rapido {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
        }
        .menu-item {
            background: #1f113a;
            border: 1px solid #3b206b;
            padding: 10px 15px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
        }
        .secao-titulo {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ffa366;
        }
        .grid-jogos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 15px;
        }
        .card-jogo {
            background: #170d2b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2d1654;
            text-align: center;
            padding-bottom: 10px;
        }
        .card-jogo img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .card-jogo span {
            font-size: 13px;
            display: block;
            margin-top: 8px;
        }
        nav.footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #120822;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #2d1654;
            z-index: 100;
        }
        .footer-item {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            cursor: pointer;
        }
        .footer-item div {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .footer-item.ativo {
            color: #ff6600;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 CANGAÇO BET</div>
        <button class="btn-entrar">ENTRAR</button>
    </header>

    <div class="audio-bar">
        <span>🎵 Luiz Gonzaga - Lengo Tengo</span>
        <button class="btn-som" id="btnSom" onclick="toggleSom()">LIGAR SOM</button>
    </div>

    <audio id="audioFundo" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <div class="menu-rapido">
        <div class="menu-item">🎯 Cangaço torneios</div>
        <div class="menu-item">🚀 Cangaço missões</div>
        <div class="menu-item">🔥 Top Jogos</div>
    </div>

    <div class="secao-titulo">🏆 TOP</div>
    <div class="grid-jogos">
        <div class="card-jogo">
            <img src="https://images.unsplash.com/photo-1534361960057-19889db9621e?w=300" alt="Fortune Tiger">
            <span>Fortune Tiger</span>
        </div>
        <div class="card-jogo">
            <img src="https://images.unsplash.com/photo-1508614589041-895b88991e3e?w=300" alt="Aviator">
            <span>Aviator</span>
        </div>
        <div class="card-jogo">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300" alt="Big Bass">
            <span>Big Bass Bonanza</span>
        </div>
        <div class="card-jogo">
            <img src="https://images.unsplash.com/photo-1535268647677-300dbf3d78d1?w=300" alt="Gates">
            <span>Gates of Olympus</span>
        </div>
    </div>

    <nav class="footer-nav">
        <div class="footer-item"><div>📋</div>Registrar</div>
        <div class="footer-item"><div>📂</div>Categorias</div>
        <div class="footer-item ativo"><div>💰</div></div>
        <div class="footer-item"><div>📺</div>Ao Vivo</div>
        <div class="footer-item"><div>🔍</div>Pesquisar</div>
    </nav>

    <script>
        function toggleSom() {
            var audio = document.getElementById('audioFundo');
            var btn = document.getElementById('btnSom');
            if (audio.paused) {
                audio.play();
                btn.innerText = "PARAR SOM";
                btn.style.background = "#ffcccc";
            } else {
                audio.pause();
                btn.innerText = "LIGAR SOM";
                btn.style.background = "#fff";
            }
        }
    </script>
</body>
</html>

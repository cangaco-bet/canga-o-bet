<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cangaceiro Bet</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1a1a;
            padding: 10px 15px;
            border-bottom: 2px solid var(--accent-color);
        }

        .logo-saldo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .saldo-box {
            background: #2a2a2a;
            border: 1px solid var(--accent-color);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .match-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .placar-tempo {
            background: #111;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            color: #00ffcc;
        }

        .odds-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .odd-btn {
            background-color: #2b2b2b;
            border: none;
            border-radius: 5px;
            padding: 8px;
            color: var(--text-color);
            text-align: center;
            cursor: pointer;
            font-size: 12px;
        }

        .odd-btn span {
            display: block;
            color: var(--text-secondary);
            font-size: 10px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-saldo">
            <span style="font-size: 20px; font-weight: bold; color: var(--accent-color);">🐺 CANGACEIRO BET</span>
        </div>
        <div class="logo-saldo">
            <div class="saldo-box">Saldo: R$ <span id="saldo-atual">1000.00</span></div>
            <button class="btn">REGISTRAR</button>
        </div>
    </header>

    <div class="container">
        <h3 style="color: var(--text-secondary); font-size: 14px;">APOSTAS AO VIVO</h3>

        <div class="match-card">
            <div class="match-header">
                <span>SUPER LEAGUE 2</span>
                <span id="tempo-1" class="placar-tempo">AO VIVO (90')</span>
            </div>
            <div class="match-teams">
                <span>Marko</span>
                <span id="placar-1">2 - 1</span>
                <span>Panthrakikos</span>
            </div>
            <div class="odds-container">
                <button class="odd-btn"><span>1 (Casa)</span> 1.45</button>
                <button class="odd-btn"><span>X (Empate)</span> 3.80</button>
                <button class="odd-btn"><span>2 (Fora)</span> 4.05</button>
            </div>
        </div>

        <div class="match-card">
            <div class="match-header">
                <span>AZADEGAN LEAGUE</span>
                <span id="tempo-2" class="placar-tempo">AO VIVO (53')</span>
            </div>
            <div class="match-teams">
                <span>Ario Eslamshahr</span>
                <span id="placar-2">0 - 0</span>
                <span>Havadar</span>
            </div>
            <div class="odds-container">
                <button class="odd-btn"><span>1 (Casa)</span> 1.55</button>
                <button class="odd-btn"><span>X (Empate)</span> 3.90</button>
                <button class="odd-btn"><span>2 (Fora)</span> 3.15</button>
            </div>
        </div>

    </div>

    <script>
        // Simulando o cronômetro em tempo real e placares dinâmicos
        let partida1 = { minutos: 90, segundos: 12, golsCasa: 2, golsFora: 1 };
        let partida2 = { minutos: 53, segundos: 40, golsCasa: 0, golsFora: 0 };

        function iniciarTempoReal() {
            setInterval(() => {
                // Atualiza Jogo 1
                partida1.segundos++;
                if (partida1.segundos >= 60) {
                    partida1.segundos = 0;
                    partida1.minutos++;
                }
                document.getElementById('tempo-1').innerText = `AO VIVO (${partida1.minutos}'${String(partida1.segundos).padStart(2, '0')}s)`;

                // Atualiza Jogo 2
                partida2.segundos++;
                if (partida2.segundos >= 60) {
                    partida2.segundos = 0;
                    partida2.minutos++;
                }
                document.getElementById('tempo-2').innerText = `AO VIVO (${partida2.minutos}'${String(partida2.segundos).padStart(2, '0')}s)`;

            }, 1000); // Roda a cada 1 segundo real
        }

        // Inicia a função assim que carregar a página
        window.onload = iniciarTempoReal;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cangaço Bet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            padding-bottom: 80px;
        }
        
        /* Tela Inicial de Boas-Vindas */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1c23, #0f1015);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }
        .splash-logo {
            font-size: 32px;
            font-weight: bold;
            color: #ff4500;
            margin-bottom: 10px;
        }
        .splash-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .btn-entrar-cassino {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: transform 0.2s;
        }
        .btn-entrar-cassino:active {
            transform: scale(0.95);
        }

        /* Conteúdo do Site (Oculto até clicar) */
        #main-content {
            display: none;
        }

        header {
            background: linear-gradient(135deg, #1a1c23, #0f1015);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff4500;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff4500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-entrar {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            margin-bottom: 10px;
        }
        .category-pill {
            background: #1e2029;
            border: 1px solid #2a2d3d;
            padding: 8px 16px;
            border-radius: 20px;
            color: #ccc;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title {
            padding: 0 15px;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }
        .game-card {
            background: #1e2029;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2d3d;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game-card:active {
            transform: scale(0.97);
        }
        .game-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .game-name {
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #13141b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222;
        }
        .nav-item {
            text-align: center;
            color: #888;
            font-size: 11px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ff4500;
        }
    </style>
</head>
<body>

    <!-- Tela Inicial de Entrada -->
    <div id="splash-screen">
        <div class="splash-logo">🔥 CANGAÇO BET</div>
        <div class="splash-subtitle">A sua nova experiência de apostas</div>
        <button class="btn-entrar-cassino" onclick="entrarNoCassino()">🎲 ENTRAR NO CASSINO</button>
    </div>

    <!-- Elemento de áudio -->
    <audio id="audioPlayer" src="https://files.catbox.moe/4plmor.mp3" preload="auto" loop></audio>

    <!-- Conteúdo Principal do Site -->
    <div id="main-content">
        <header>
            <div class="logo">🔥 CANGAÇO BET</div>
            <button class="btn-entrar">ENTRAR</button>
        </header>

        <div class="categories">
            <div class="category-pill">🤠 Cangaço torneios</div>
            <div class="category-pill">🌵 Cangaço missões</div>
            <div class="category-pill">🔥 Top</div>
        </div>

        <div class="section-title">🏆 TOP</div>

        <div class="games-grid">
            <div class="game-card" onclick="pararMusicaEEntrar('Fortune Tiger')">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300" class="game-img" alt="Fortune Tiger">
                <div class="game-name">Fortune Tiger</div>
            </div>
            <div class="game-card" onclick="pararMusicaEEntrar('Aviator')">
                <img src="https://images.unsplash.com/photo-1508614589041-895b88991e3e?w=300" class="game-img" alt="Aviator">
                <div class="game-name">Aviator</div>
            </div>
            <div class="game-card" onclick="pararMusicaEEntrar('Big Bass Bonanza')">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300" class="game-img" alt="Big Bass">
                <div class="game-name">Big Bass Bonanza</div>
            </div>
            <div class="game-card" onclick="pararMusicaEEntrar('Gates of Olympus')">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300" class="game-img" alt="Gates of Olympus">
                <div class="game-name">Gates of Olympus</div>
            </div>
        </div>

        <nav>
            <a href="#" class="nav-item">📁<br>Registrar</a>
            <a href="#" class="nav-item">📂<br>Categorias</a>
            <a href="#" class="nav-item active">💰<br>Cangaço</a>
            <a href="#" class="nav-item">📺<br>Ao Vivo</a>
            <a href="#" class="nav-item">🔍<br>Pesquisar</a>
        </nav>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const splashScreen = document.getElementById('splash-screen');
        const mainContent = document.getElementById('main-content');

        function entrarNoCassino() {
            // Toca a música
            audio.play().catch(e => console.log(e));
            
            // Esconde a tela de entrada e mostra o site
            splashScreen.style.display = 'none';
            mainContent.style.display = 'block';
        }

        function pararMusicaEEntrar(nomeJogo) {
            audio.pause(); 
            audio.currentTime = 0; 
            alert('A entrar em ' + nomeJogo + '...');
        }
    </script>
</body>
</html>

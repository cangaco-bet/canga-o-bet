<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cangaço Bet - Penalty Shoot-Out 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding-bottom: 25px;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #151821, #0b0c10); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #ff4500; position: sticky; top: 0; z-index: 90;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-img-pequena { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid #ffb703; }
        .saldo-topo-3d {
            background: linear-gradient(145deg, #1f2430, #13161f); border: 1px solid #ffb703;
            padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #ffb703;
        }
        .saldo-topo-3d span { color: #fff; }

        .section-title { padding: 0 15px; font-size: 16px; margin: 15px 0; font-weight: bold; color: #fff; text-transform: uppercase; }

        /* --- PENALTY SHOOT-OUT 3D EXCLUSIVO --- */
        #footballModal {
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            padding: 10px; width: 100vw; height: calc(100vh - 65px); max-width: 500px; margin: 0 auto;
        }
        
        /* ESTÁDIO E BALIZA */
        .stadium-container-3d {
            position: relative; width: 100%; flex-grow: 1; max-height: 500px;
            background: linear-gradient(180deg, #103822 0%, #0a2414 100%);
            border: 3px solid #ffb703; border-radius: 18px; overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
            touch-action: none; margin-bottom: 15px;
        }

        .goal-frame {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            width: 85%; height: 190px; border: 8px solid #ffffff; border-bottom: none;
            border-radius: 5px 5px 0 0; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 5; pointer-events: none;
        }
        .goal-net {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 18px 18px;
            z-index: 4;
        }

        /* MULTIPLICADORES */
        .multipliers-bar {
            position: absolute; top: 12px; left: 0; width: 100%; display: flex; justify-content: space-evenly;
            padding: 0 10px; z-index: 15; pointer-events: none;
        }
        .mult-badge {
            background: rgba(0, 0, 0, 0.8); border: 1px solid #00ff88; color: #00ff88;
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 900;
            transition: all 0.3s ease;
        }
        .mult-badge.active { background: #00ff88; color: #000; transform: scale(1.15); box-shadow: 0 0 12px #00ff88; }

        /* GOLEIRO COM BRAÇOS ARTICULADOS E SALTO REALISTA */
        .goleiro-real-3d {
            position: absolute; top: 105px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 180px; z-index: 10;
            /* Eixo central para que o corpo inteiro salte e gire livremente pelo ar */
            transform-origin: center center;
            transition: transform 0.45s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* ALVOS NOS CANTOS DA BALIZA */
        .target-spot {
            position: absolute; width: 44px; height: 44px; 
            background: rgba(0, 255, 136, 0.1); border: 2px dashed #00ff88;
            border-radius: 50%; z-index: 20; cursor: pointer;
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 0 12px rgba(0,255,136,0.6);
            animation: pulseTarget 1s infinite alternate;
        }
        .target-inner {
            width: 16px; height: 16px; background: #00ff88;
            border-radius: 50%; box-shadow: 0 0 8px #fff;
        }
        @keyframes pulseTarget { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1.1); opacity: 1; } }

        /* Posições Perfeitas dentro da baliza */
        #target1 { top: 55px; left: 10%; }
        #target2 { top: 55px; right: 10%; }
        #target3 { top: 50px; left: 50%; transform: translateX(-50%); }
        #target4 { top: 170px; left: 15%; }
        #target5 { top: 170px; right: 15%; }

        /* FÍSICA DA BOLA */
        .bola-penalty-3d {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) scale(1);
            width: 42px; height: 42px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d5d5d5 40%, #555 85%, #111 100%);
            border-radius: 50%; box-shadow: 8px 12px 20px rgba(0,0,0,0.8);
            z-index: 25; transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* RESULTADO ANIMADO */
        .win-display-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            z-index: 30; display: none; text-align: center; width: 100%; opacity: 0;
            transition: all 0.3s cubic-bezier(0.17, 0.89, 0.32, 1.28); pointer-events: none;
        }
        .win-display-banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .win-red-amount { font-size: 32px; font-weight: 950; color: #ff2a2a; text-shadow: 0 0 20px #ff0000, 0 3px 5px #000; text-transform: uppercase; }
        .win-white-text { font-size: 36px; font-weight: 950; color: #ffffff; text-shadow: 0 0 15px #ffffff, 0 3px 5px #000; margin-top: 5px; }

        /* CONTROLOS */
        .penalty-controls-box {
            width: 100%; background: #151821; padding: 15px; border-radius: 16px; 
            border: 1px solid rgba(0,255,136,0.3); z-index: 25; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        .bet-control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: bold; }
        .bet-adjust-box { display: flex; align-items: center; gap: 8px; }
        .btn-bet-step { background: #ff4500; color: #fff; border: none; width: 36px; height: 36px; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; }
        .bet-input-display { background: #0f1118; border: 1px solid #00ff88; color: #00ff88; padding: 8px 10px; border-radius: 8px; font-weight: 900; font-size: 16px; width: 90px; text-align: center; }
        .btn-confirmar-aposta { width: 100%; padding: 16px; background: linear-gradient(180deg, #00ff88 0%, #00cc6a 50%, #008f4b 100%); color: #000; border: none; border-radius: 50px; font-weight: 950; font-size: 18px; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5); text-transform: uppercase; }
        .btn-confirmar-aposta:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://files.catbox.moe/qf2bly.jpeg" class="logo-img-pequena" alt="Logo">
        </div>
        <div class="header-right">
            <div class="saldo-topo-3d">💰 Saldo: R$ <span id="saldoAtual">1000.00</span></div>
        </div>
    </header>

    <div class="section-title">🏆 PENALTY SHOOT-OUT 3D</div>

    <div id="footballModal">
        <div class="stadium-container-3d" id="stadiumContainer">
            <div class="goal-frame"><div class="goal-net"></div></div>

            <div class="multipliers-bar">
                <div class="mult-badge" id="m1">1.92x</div>
                <div class="mult-badge" id="m2">3.84x</div>
                <div class="mult-badge" id="m3">7.68x</div>
                <div class="mult-badge" id="m4">15.36x</div>
                <div class="mult-badge" id="m5">30.72x</div>
            </div>

            <!-- GOLEIRO REALISTA COM ROSTO, CABELO E LUVAS REAIS -->
            <div class="goleiro-real-3d" id="goleiroEl">
                <svg viewBox="0 0 200 220" width="100%" height="100%" style="overflow: visible;">
                    <defs>
                        <!-- Gradiente de Pele Realista -->
                        <radialGradient id="skinBase" cx="40%" cy="40%" r="60%">
                            <stop offset="0%" stop-color="#ffcdb2"/>
                            <stop offset="60%" stop-color="#e29578"/>
                            <stop offset="100%" stop-color="#9d4a2a"/>
                        </radialGradient>
                        <!-- Cabelo 3D -->
                        <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#3e2723"/>
                            <stop offset="100%" stop-color="#140b08"/>
                        </linearGradient>
                        <!-- Uniforme Pro -->
                        <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2980b9"/>
                            <stop offset="50%" stop-color="#1b4f72"/>
                            <stop offset="100%" stop-color="#0a1d2a"/>
                        </linearGradient>
                        <!-- Luvas Brancas -->
                        <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="70%" stop-color="#bdc3c7"/>
                            <stop offset="100%" stop-color="#7f8c8d"/>
                        </linearGradient>
                        <!-- Sombras -->
                        <filter id="gkShadow">
                            <feDropShadow dx="0" dy="12" stdDeviation="6" flood-opacity="0.65"/>
                        </filter>
                    </defs>

                    <g filter="url(#gkShadow)">
                        <!-- PERNAS & CHUTEIRAS -->
                        <path d="M82 120 L96 120 L90 160 L78 160 Z" fill="url(#skinBase)"/>
                        <path d="M118 120 L104 120 L110 160 L122 160 Z" fill="url(#skinBase)"/>
                        <!-- Calções Pretos -->
                        <path d="M72 110 L128 110 L124 135 L105 130 L100 120 L95 130 L76 135 Z" fill="#111"/>
                        <!-- Meias -->
                        <path d="M78 160 L90 160 L87 190 L75 190 Z" fill="#fff"/>
                        <path d="M122 160 L110 160 L113 190 L125 190 Z" fill="#fff"/>
                        <path d="M77 170 L89 170 M76 175 L88 175" stroke="#2980b9" stroke-width="2"/>
                        <path d="M123 170 L111 170 M124 175 L112 175" stroke="#2980b9" stroke-width="2"/>
                        <!-- Chuteiras Neon -->
                        <path d="M75 190 L87 190 L90 205 L70 205 Z" fill="#ccff00"/>
                        <path d="M125 190 L113 190 L110 205 L130 205 Z" fill="#ccff00"/>

                        <!-- BRAÇO ESQUERDO (Articulado no Ombro) -->
                        <g id="gk-arm-left" style="transform-origin: 80px 65px; transform: rotate(60deg); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);">
                            <!-- Manga e Braço -->
                            <path d="M85 55 L35 60 L35 72 L85 75 Z" fill="url(#jerseyGrad)"/>
                            <path d="M36 62 L18 62 L18 70 L36 70 Z" fill="url(#skinBase)"/>
                            <!-- Luva de Goleiro Detalhada -->
                            <path d="M22 53 Q -2 53 3 66 Q -2 79 22 79 Z" fill="url(#gloveGrad)"/>
                            <rect x="20" y="52" width="6" height="28" fill="#111" rx="2"/>
                            <!-- Dedos da Luva -->
                            <path d="M10 56 L 2 58 M 8 61 L -2 63 M 8 66 L -2 66 M 10 71 L 2 73 M 15 75 L 8 80" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
                        </g>

                        <!-- BRAÇO DIREITO (Articulado no Ombro) -->
                        <g id="gk-arm-right" style="transform-origin: 120px 65px; transform: rotate(-60deg); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);">
                            <path d="M115 55 L165 60 L165 72 L115 75 Z" fill="url(#jerseyGrad)"/>
                            <path d="M164 62 L182 62 L182 70 L164 70 Z" fill="url(#skinBase)"/>
                            <!-- Luva -->
                            <path d="M178 53 Q 202 53 197 66 Q 202 79 178 79 Z" fill="url(#gloveGrad)"/>
                            <rect x="174" y="52" width="6" height="28" fill="#111" rx="2"/>
                            <!-- Dedos da Luva -->
                            <path d="M190 56 L 198 58 M 192 61 L 202 63 M 192 66 L 202 66 M 190 71 L 198 73 M 185 75 L 192 80" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
                        </g>

                        <!-- TRONCO (Com detalhes e sombras) -->
                        <path d="M70 55 Q 60 55 65 115 L 135 115 Q 140 55 130 55 Z" fill="url(#jerseyGrad)"/>
                        <path d="M70 55 Q 60 55 65 115 L 135 115 Q 140 55 130 55 Z" fill="rgba(0,0,0,0.15)"/>
                        <path d="M90 55 L 100 70 L 110 55 Z" fill="#111"/> <!-- Gola -->
                        <path d="M90 75 L 110 75 L 105 95 L 95 95 Z" fill="rgba(255,255,255,0.1)"/> <!-- Sombra do peito -->

                        <!-- CABEÇA & ROSTO HUMANO -->
                        <!-- Pescoço -->
                        <rect x="93" y="42" width="14" height="15" fill="url(#skinBase)"/>
                        <!-- Orelhas -->
                        <circle cx="81" cy="27" r="5" fill="url(#skinBase)"/>
                        <circle cx="119" cy="27" r="5" fill="url(#skinBase)"/>
                        <!-- Base do Rosto -->
                        <path d="M81 24 C 81 2, 119 2, 119 24 C 119 46, 110 50, 100 50 C 90 50, 81 46, 81 24 Z" fill="url(#skinBase)"/>
                        
                        <!-- Cabelo Moderno 3D -->
                        <path d="M79 18 C 85 -8, 115 -8, 121 18 C 120 10, 100 5, 79 18 Z" fill="url(#hairGrad)"/>
                        <path d="M79 18 Q 82 13 80 26 M121 18 Q 118 13 120 26" stroke="url(#hairGrad)" stroke-width="2" fill="none"/>

                        <!-- Sobrancelhas -->
                        <path d="M86 21 Q 91 18 95 22" stroke="#2c1a11" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                        <path d="M114 21 Q 109 18 105 22" stroke="#2c1a11" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                        
                        <!-- Olhos -->
                        <circle cx="91" cy="26" r="2.5" fill="#fff"/>
                        <circle cx="91.5" cy="26" r="1.2" fill="#111"/>
                        <circle cx="109" cy="26" r="2.5" fill="#fff"/>
                        <circle cx="108.5" cy="26" r="1.2" fill="#111"/>
                        
                        <!-- Nariz -->
                        <path d="M100 27 L 98 34 L 101 35" stroke="#9d4a2a" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
                        
                        <!-- Boca e Expressão Focada -->
                        <path d="M93 41 Q 100 44 107 41" stroke="#6e2d18" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        <path d="M96 41 Q 100 45 104 41" fill="#fff" opacity="0.7"/> <!-- Dentes/Boca levemente aberta -->
                        <path d="M86 36 Q 100 52 114 36" stroke="#2c1a11" stroke-width="2" fill="none" opacity="0.25"/> <!-- Sombra do queixo -->
                    </g>
                </svg>
            </div>

            <!-- ALVOS -->
            <div class="target-spot" id="target1" onclick="chutarPenalty(1)"><div class="target-inner"></div></div>
            <div class="target-spot" id="target2" onclick="chutarPenalty(2)"><div class="target-inner"></div></div>
            <div class="target-spot" id="target3" onclick="chutarPenalty(3)"><div class="target-inner"></div></div>
            <div class="target-spot" id="target4" onclick="chutarPenalty(4)"><div class="target-inner"></div></div>
            <div class="target-spot" id="target5" onclick="chutarPenalty(5)"><div class="target-inner"></div></div>

            <!-- BOLA -->
            <div class="bola-penalty-3d" id="bolaEl"></div>

            <!-- RESULTADO -->
            <div class="win-display-banner" id="winBanner">
                <div class="win-red-amount" id="winValorVermelho">R$ 20.00 virou</div>
                <div class="win-white-text" id="winValorBranco">R$ 38.40</div>
            </div>
        </div>

        <div class="penalty-controls-box">
            <div class="bet-control-row">
                <span>Valor da Aposta:</span>
                <div class="bet-adjust-box">
                    <button class="btn-bet-step" onclick="alterarAposta(-1)">-</button>
                    <input type="text" id="penaltyBetInput" class="bet-input-display" value="20.00" readonly>
                    <button class="btn-bet-step" onclick="alterarAposta(1)">+</button>
                </div>
            </div>
            <button class="btn-confirmar-aposta" id="btnConfirmarAposta" onclick="iniciarNovoPenalty()">CHUTAR PÊNALTI</button>
        </div>
    </div>

    <script>
        let saldo = parseFloat(localStorage.getItem('cangaco_saldo')) || 1000.00;
        let nivelAtual = 0;
        let jogadaEmAndamento = false;
        const multiplicadores = [1.92, 3.84, 7.68, 15.36, 30.72];

        function atualizarSaldoNaTela() { 
            document.getElementById('saldoAtual').innerText = saldo.toFixed(2); 
            localStorage.setItem('cangaco_saldo', saldo); 
        }
        atualizarSaldoNaTela();

        function alterarAposta(delta) {
            if(jogadaEmAndamento) return;
            let input = document.getElementById('penaltyBetInput');
            let val = parseFloat(input.value) + (delta * 10);
            if (val < 10) val = 10;
            input.value = val.toFixed(2);
        }

        function iniciarNovoPenalty() {
            if(jogadaEmAndamento) return;
            let apostaVal = parseFloat(document.getElementById('penaltyBetInput').value);
            
            if (nivelAtual === 0) {
                if (saldo < apostaVal) { alert("Saldo insuficiente!"); return; }
                saldo -= apostaVal; 
                atualizarSaldoNaTela();
            }

            // Reseta a interface, a bola e o corpo do goleiro
            document.getElementById('winBanner').classList.remove('show');
            setTimeout(() => { document.getElementById('winBanner').style.display = 'none'; }, 300);
            
            document.getElementById('bolaEl').style.transform = 'translateX(-50%) scale(1)';
            document.getElementById('goleiroEl').style.transform = 'translateX(-50%) translateY(0) rotate(0deg)';
            
            // Retorna os braços do goleiro realista à posição de repouso
            document.getElementById('gk-arm-left').style.transform = 'rotate(60deg)';
            document.getElementById('gk-arm-right').style.transform = 'rotate(-60deg)';
            
            atualizarMultiplicadoresUI();
            mostrarAlvos(true);
            
            let btn = document.getElementById('btnConfirmarAposta');
            btn.innerText = "ESCOLHA O ALVO";
            btn.style.background = "#555";
            btn.style.color = "#aaa";
            btn.style.boxShadow = "none";
        }

        function atualizarMultiplicadoresUI() {
            for (let i = 1; i <= 5; i++) {
                let badge = document.getElementById('m' + i);
                badge.classList.remove('active');
                if (i - 1 === nivelAtual) badge.classList.add('active');
            }
        }

        function mostrarAlvos(status) {
            let displayVal = status ? 'flex' : 'none';
            for (let i = 1; i <= 5; i++) { document.getElementById('target' + i).style.display = displayVal; }
        }

        function chutarPenalty(cantoEscolhido) {
            jogadaEmAndamento = true;
            mostrarAlvos(false);
            let apostaVal = parseFloat(document.getElementById('penaltyBetInput').value);

            let bola = document.getElementById('bolaEl');
            let goleiro = document.getElementById('goleiroEl');
            let armL = document.getElementById('gk-arm-left');
            let armR = document.getElementById('gk-arm-right');

            // BOLA (Física 3D para o fundo da baliza)
            let bolaMovimentos = {
                1: 'translate(calc(-50% - 115px), -250px) scale(0.4)',
                2: 'translate(calc(-50% + 115px), -250px) scale(0.4)',
                3: 'translate(-50%, -250px) scale(0.4)',
                4: 'translate(calc(-50% - 90px), -135px) scale(0.55)',
                5: 'translate(calc(-50% + 90px), -135px) scale(0.55)'
            };
            
            // CORPO DO GOLEIRO (Salto acrobático)
            let goleiroMovimentos = {
                1: 'translate(calc(-50% - 85px), -70px) rotate(-65deg)',
                2: 'translate(calc(-50% + 85px), -70px) rotate(65deg)',
                3: 'translate(-50%, -85px) rotate(0deg)',
                4: 'translate(calc(-50% - 100px), 10px) rotate(-85deg)',
                5: 'translate(calc(-50% + 100px), 10px) rotate(85deg)'
            };

            setTimeout(() => {
                bola.style.transform = bolaMovimentos[cantoEscolhido];
                goleiro.style.transform = goleiroMovimentos[cantoEscolhido];

                // BRAÇOS DO GOLEIRO (Eles apontam/esticam perfeitamente para a bola)
                if (cantoEscolhido === 1 || cantoEscolhido === 4) {
                    armL.style.transform = 'rotate(-20deg)'; // Braço esquerdo estica em direção à bola
                    armR.style.transform = 'rotate(-80deg)'; // Braço direito acompanha o movimento do corpo
                } else if (cantoEscolhido === 2 || cantoEscolhido === 5) {
                    armR.style.transform = 'rotate(20deg)'; // Braço direito estica em direção à bola
                    armL.style.transform = 'rotate(80deg)';  // Braço esquerdo acompanha o corpo
                } else {
                    armL.style.transform = 'rotate(-80deg)'; // Levanta os dois braços para tentar defender o meio
                    armR.style.transform = 'rotate(80deg)';
                }

                setTimeout(() => {
                    let goleiroDefendeu = Math.random() < 0.25 && nivelAtual > 0;
                    let banner = document.getElementById('winBanner');

                    if (!goleiroDefendeu) {
                        let mult = multiplicadores[nivelAtual];
                        let premioTotal = apostaVal * mult;
                        
                        document.getElementById('winValorVermelho').innerText = `R$ ${apostaVal.toFixed(2)} viro`;
                        document.getElementById('winValorBranco').innerText = `R$ ${premioTotal.toFixed(2)}`;
                        
                        banner.style.display = 'block';
                        setTimeout(() => banner.classList.add('show'), 50);

                        nivelAtual++;
                        let btn = document.getElementById('btnConfirmarAposta');
                        btn.style.background = "linear-gradient(180deg, #00ff88 0%, #00cc6a 50%, #008f4b 100%)";
                        btn.style.color = "#000";
                        btn.style.boxShadow = "0 6px 20px rgba(0, 255, 136, 0.5)";

                        if (nivelAtual >= 5) {
                            saldo += premioTotal; atualizarSaldoNaTela();
                            btn.innerText = "SACAR E REINICIAR";
                            nivelAtual = 0;
                        } else {
                            btn.innerText = "CONTINUAR CHUTANDO";
                        }
                        jogadaEmAndamento = false;

                    } else {
                        document.getElementById('winValorVermelho').innerText = "DEFESA!";
                        document.getElementById('winValorVermelho').style.color = "#ff2a2a";
                        document.getElementById('winValorBranco').innerText = "Tente de novo";
                        
                        banner.style.display = 'block';
                        setTimeout(() => banner.classList.add('show'), 50);
                        
                        let btn = document.getElementById('btnConfirmarAposta');
                        btn.style.background = "linear-gradient(180deg, #ff4500 0%, #cc3500 100%)";
                        btn.style.color = "#fff";
                        btn.style.boxShadow = "0 6px 20px rgba(255, 69, 0, 0.5)";
                        btn.innerText = "NOVO PÊNALTI";
                        
                        nivelAtual = 0;
                        jogadaEmAndamento = false;
                    }
                }, 450);
            }, 50);
        }
        
        document.getElementById('btnConfirmarAposta').innerText = "ESCOLHA O ALVO";
        document.getElementById('btnConfirmarAposta').style.background = "#555";
        document.getElementById('btnConfirmarAposta').style.color = "#aaa";
        atualizarMultiplicadoresUI();
    </script>
</body>
</html>

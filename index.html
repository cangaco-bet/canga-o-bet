<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Tiger - Cangaço Bet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #120303;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Container Principal estilo Slot Mobile */
        .slot-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #8b0000 0%, #3a0000 50%, #120303 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
        }

        /* Topo com Status e Relógio */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            font-size: 12px;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Topo do Tigre */
        .tiger-header {
            text-align: center;
            position: relative;
            margin-top: -10px;
        }
        .tiger-header img {
            width: 140px;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.6));
        }
        .multiplier-badge {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffcc00;
            color: #8b0000;
            font-weight: 900;
            font-size: 18px;
            padding: 2px 12px;
            border-radius: 20px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Estrutura dos Rolos (Reels) */
        .machine-frame {
            background: #b22222;
            margin: 0 15px;
            padding: 12px;
            border-radius: 15px;
            border: 4px solid #ffcc00;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }
        .tiger-reels {
            display: flex;
            justify-content: center;
            gap: 8px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
        }
        .reel {
            font-size: 36px;
            background: #fdfdfd;
            width: 95px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 2px solid #ddd;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Mensagem de Evento / Vitórias */
        .game-message {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 1px 1px 2px #000;
            min-height: 25px;
            margin: 5px 0;
        }

        /* Painel Inferior de Apostas */
        .bottom-panel {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-top: 2px solid #ffcc00;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            background: #2a0000;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ffcc00;
            font-size: 12px;
        }
        .stat-box span {
            display: block;
            font-size: 10px;
            color: #aaa;
        }
        .stat-box strong {
            color: #00ff88;
            font-size: 13px;
        }

        /* Botão de Girar Principal */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-side {
            background: #b22222;
            color: #fff;
            border: 2px solid #ffcc00;
            padding: 10px 14px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-girar-tiger {
            background: radial-gradient(circle, #00ff88 0%, #008844 100%);
            color: white;
            border: 4px solid #ffcc00;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 2px #000;
        }
        .btn-girar-tiger:active {
            transform: scale(0.95);
        }

        /* Overlay de Mega Ganho (Animação estilo vídeo) */
        #winOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        #winOverlay h1 {
            color: #ffcc00;
            font-size: 32px;
            font-style: italic;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ffcc00;
            margin-bottom: 10px;
        }
        #winOverlay p {
            color: #ffffff;
            font-size: 38px;
            font-weight: 900;
            text-shadow: 2px 2px 5px #000;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="slot-container">
        <!-- Topo da Tela (Relógio e Bateria) -->
        <div class="top-bar">
            <span>Fortune Tiger</span>
            <span id="relogio">09:30:52</span>
        </div>

        <!-- Cabeçalho com o Tigre e o Multiplicador -->
        <div class="tiger-header">
            <div class="multiplier-badge" id="multiBadge">x10</div>
            <!-- Usando emoji estilizado ou ícone representativo do tigre do vídeo -->
            <div style="font-size: 65px; margin-top: 5px;">🐯</div>
        </div>

        <!-- Tela dos Rolos (3x3) -->
        <div class="machine-frame">
            <div class="tiger-reels">
                <div class="reel" id="reel1">💰</div>
                <div class="reel" id="reel2">💰</div>
                <div class="reel" id="reel3">💰</div>
            </div>
        </div>

        <!-- Mensagem de Status -->
        <div class="game-message" id="gameStatus">Funcionalidade Tigre da Sorte!</div>

        <!-- Painel Inferior Exato do Vídeo -->
        <div class="bottom-panel">
            <div class="stats-row">
                <div class="stat-box">
                    <span>Saldo</span>
                    <strong id="saldoJogo">R$ 99,50</strong>
                </div>
                <div class="stat-box">
                    <span>Aposta</span>
                    <strong style="color: #ffcc00;">R$ 2,00</strong>
                </div>
                <div class="stat-box">
                    <span>Ganho</span>
                    <strong id="ganhoJogo" style="color: #00ff88;">R$ 0,00</strong>
                </div>
            </div>

            <div class="controls-row">
                <button class="btn-side" onclick="alert('Turbo Ativado!')">⚡<br>TURBO</button>
                <button class="btn-girar-tiger" onclick="girarTiger()">
                    🐯<span style="font-size: 11px;">GIRAR</span>
                </button>
                <button class="btn-side" onclick="alert('Auto Girar')">🔄<br>AUTO</button>
            </div>
        </div>

        <!-- Tela de Mega Ganho -->
        <div id="winOverlay" onclick="fecharGanho()">
            <h1>SUPER MEGA GANHO</h1>
            <p id="premioValor">R$ 2.320,00</p>
            <span style="font-size: 12px; color: #aaa; margin-top: 20px;">(Toque para continuar)</span>
        </div>
    </div>

    <script>
        // Relógio em tempo real igual ao topo do vídeo
        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toTimeString().split(' ')[0];
        }, 1000);

        let saldo = 99.50;

        function atualizarUI() {
            document.getElementById('saldoJogo').innerText = 'R$ ' + saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        }

        function girarTiger() {
            if (saldo < 2.00) {
                alert('Saldo insuficiente!');
                return;
            }

            saldo -= 2.00;
            atualizarUI();

            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');
            const status = document.getElementById('gameStatus');
            const ganhoEl = document.getElementById('ganhoJogo');

            status.innerText = "Girando os rolos...";
            ganhoEl.innerText = "R$ 0,00";
            r1.innerText = "🔄"; r2.innerText = "🔄"; r3.innerText = "🔄";

            setTimeout(() => {
                const simbolos = ["💰", "🍊", "🍋", "📜", "⭐", "🧧"];
                let chance = Math.random();

                if (chance < 0.70) {
                    // Perdeu
                    r1.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    r2.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    r3.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    status.innerText = "Tente novamente!";
                } else if (chance < 0.95) {
                    // Ganho Simples
                    r1.innerText = "💰"; r2.innerText = "💰"; r3.innerText = "💰";
                    let premio = 1.50;
                    saldo += premio;
                    ganhoEl.innerText = "R$ " + premio.toFixed(2);
                    status.innerText = "Funcionalidade Tigre da Sorte!";
                } else {
                    // SUPER MEGA GANHO igualzinho ao vídeo do link[span_4](start_span)[span_4](end_span)!
                    r1.innerText = "💰"; r2.innerText = "💰"; r3.innerText = "💰";
                    let premioAlto = 2320.00;
                    saldo += premioAlto;
                    ganhoEl.innerText = "R$ " + premioAlto.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
                    status.innerText = "SUPER MEGA GANHO!";
                    
                    document.getElementById('premioValor').innerText = "R$ " + premioAlto.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
                    document.getElementById('winOverlay').style.display = 'flex';
                }
                atualizarUI();
            }, 900);
        }

        function fecharGanho() {
            document.getElementById('winOverlay').style.display = 'none';
        }
    </script>
</body>
</html>

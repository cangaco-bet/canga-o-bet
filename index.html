<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cangaço Bet - Penalty Shoot-Out 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding-bottom: 25px;
        }

        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a101f 0%, #0b0c10 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        .splash-banner {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
            border: 3px solid #ff4500; box-shadow: 0 0 35px rgba(255, 69, 0, 0.8);
            animation: float4D 3s ease-in-out infinite; margin-bottom: 25px;
        }
        @keyframes float4D {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-15px) rotate(4deg) scale(1.06); filter: drop-shadow(0 20px 30px rgba(255,183,3,0.6)); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }
        .loading-container { width: 260px; background: #151821; border: 1px solid #2c3347; border-radius: 20px; overflow: hidden; height: 14px; margin-bottom: 15px; }
        .loading-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4500, #ffb703); border-radius: 20px; transition: width 0.1s linear; }
        .loading-text { font-size: 13px; font-weight: bold; color: #ffb703; margin-bottom: 20px; letter-spacing: 1px; }
        .btn-entrar-splash {
            display: none; background: linear-gradient(135deg, #ff4500, #ff6a00); color: #fff;
            border: none; padding: 12px 30px; border-radius: 12px; font-size: 15px; font-weight: 900;
            cursor: pointer; box-shadow: 0 6px 20px rgba(255, 69, 0, 0.6);
        }

        header {
            background: linear-gradient(135deg, #151821, #0b0c10); padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #ff4500; position: sticky; top: 0; z-index: 90;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-menu-lateral {
            background: #191d28; border: 1px solid #ff4500; width: 38px; height: 38px;
            border-radius: 10px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; gap: 4px; cursor: pointer;
        }
        .btn-menu-lateral span { width: 18px; height: 2px; background-color: #ff4500; border-radius: 2px; }
        .logo-img-pequena { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1.5px solid #ffb703; cursor: pointer; }
        .saldo-topo-3d {
            background: linear-gradient(145deg, #1f2430, #13161f); border: 1px solid #ffb703;
            padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; color: #ffb703;
            display: flex; align-items: center; gap: 4px;
        }
        .saldo-topo-3d span { color: #fff; }
        .btn-topo-acao { background: linear-gradient(135deg, #ff4500, #cc3500); color: white; border: none; padding: 7px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .btn-topo-login { background: transparent; color: #ffb703; border: 1px solid #ffb703; padding: 7px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; }

        .quick-search-bar { padding: 12px 15px; background: #0f1118; border-bottom: 1px solid #1a1d28; }
        .quick-search-input { width: 100%; padding: 10px 15px; background: #151821; border: 1px solid #232838; border-radius: 20px; color: white; font-size: 13px; }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 998; }
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: linear-gradient(180deg, #151821, #0f1118); border-right: 2px solid #ff4500;
            z-index: 999; transition: left 0.3s ease; padding: 20px; display: flex; flex-direction: column;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #232838; padding-bottom: 15px; }
        .sidebar-title { font-size: 16px; font-weight: bold; color: #ff4500; }
        .sidebar-close { font-size: 22px; color: #aaa; cursor: pointer; }
        .sidebar-item {
            background: #191d28; border: 1px solid #232838; padding: 12px 15px; border-radius: 12px;
            color: #fff; font-size: 14px; font-weight: bold; margin-bottom: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
        }

        .main-tab-content { display: none; }
        .main-tab-content.active-tab { display: block; }

        .promo-carousel-container {
            margin: 15px; border-radius: 14px; overflow: hidden; border: 1px solid #ff4500;
            position: relative; height: 120px;
        }
        .promo-track { display: flex; transition: transform 0.5s ease-in-out; height: 100%; width: 300%; }
        .promo-slide {
            width: 33.333%; height: 100%; background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 10px; position: relative;
        }
        .promo-slide::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); z-index: 1; }
        .promo-content { position: relative; z-index: 2; }
        .promo-slide h3 { font-size: 14px; color: #ffb703; margin-bottom: 3px; }
        .promo-slide p { font-size: 11px; color: #ddd; margin-bottom: 6px; }
        .btn-cadastre { background: linear-gradient(135deg, #ff4500, #ff6a00); color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }

        /* --- PENALTY SHOOT-OUT 3D (REFEITO) --- */
        #footballModal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #092015 0%, #020804 100%);
            z-index: 99999; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 10px; overflow: hidden;
        }
        .penalty-header-top {
            width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(0,0,0,0.85); border-radius: 12px; border: 1px solid #00ff88;
        }
        .modal-title-football { font-size: 15px; font-weight: 950; color: #00ff88; text-transform: uppercase; }
        .close-fullscreen { color: #fff; font-size: 24px; cursor: pointer; font-weight: bold; }

        /* ESTÁDIO 3D E BALIZA */
        .stadium-container-3d {
            position: relative; width: 100%; max-width: 480px; flex-grow: 1;
            background: linear-gradient(180deg, #1b5e3b 0%, #0a2e19 100%);
            border: 3px solid #ffb703; border-radius: 18px; overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
            margin: 6px 0; touch-action: none;
        }
        /* A REDE/BALIZA CORRETA NO TOPO */
        .goal-frame {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 210px; border: 7px solid #ffffff; border-bottom: none;
            border-radius: 8px 8px 0 0; box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        .goal-net {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 15px, rgba(255,255,255,0.2) 15px, rgba(255,255,255,0.2) 17px),
                        repeating-linear-gradient(90deg, transparent, transparent 15px, rgba(255,255,255,0.2) 15px, rgba(255,255,255,0.2) 17px);
        }

        /* MULTIPLICADORES NO TOPO */
        .multipliers-bar {
            position: absolute; top: 10px; left: 0; width: 100%; display: flex; justify-content: space-around;
            padding: 0 15px; z-index: 15; pointer-events: none;
        }
        .mult-badge {
            background: rgba(0, 0, 0, 0.75); border: 1px solid #00ff88; color: #00ff88;
            padding: 3px 8px; border-radius: 8px; font-size: 11px; font-weight: 900;
        }
        .mult-badge.active { background: #00ff88; color: #000; transform: scale(1.15); box-shadow: 0 0 10px #00ff88; }

        /* GOLEIRO 3D REALISTA (SEM MÃOS REDONDAS, COM ILUMINAÇÃO ANATÔMICA) */
        .goleiro-real-3d {
            position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 140px; z-index: 10;
            transition: all 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.7));
        }

        /* 5 ALVOS CORRETOS NOS CANTOS DA BALIZA (NÃO MAIS EM PIRÂMIDE) */
        .target-spot {
            position: absolute; width: 44px; height: 44px; 
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #ffcc00; border-radius: 50%; z-index: 20; cursor: pointer;
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 0 15px #ffcc00, inset 0 0 10px #ffcc00;
            animation: pulseTarget 1.2s infinite alternate;
        }
        .target-inner-ball {
            width: 18px; height: 18px; background: radial-gradient(circle at 30% 30%, #fff, #888);
            border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
        @keyframes pulseTarget { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.15); opacity: 1; } }

        /* POSIÇÕES REAIS DENTRO DA BALIZA */
        #target1 { top: 65px; left: 10%; } /* Canto Superior Esquerdo */
        #target2 { top: 65px; right: 10%; } /* Canto Superior Direito */
        #target3 { top: 65px; left: 50%; transform: translateX(-50%); } /* Meio Superior */
        #target4 { top: 180px; left: 10%; } /* Canto Inferior Esquerdo */
        #target5 { top: 180px; right: 10%; } /* Canto Inferior Direito */

        /* A ÚNICA BOLA NO CHÃO */
        .bola-penalty-3d {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 38px; height: 38px; background: radial-gradient(circle at 30% 30%, #ffffff 0%, #aaaaaa 60%, #111111 100%);
            border-radius: 50%; border: 2px solid #000; box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            z-index: 15; transition: all 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        /* TELA DE VITÓRIA / DEFESA */
        .win-display-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 30; display: none; text-align: center; width: 100%; pointer-events: none;
        }
        .win-red-amount {
            font-size: 34px; font-weight: 950; color: #ff2a2a;
            text-shadow: 0 0 20px #ff0000, 0 0 10px #000; text-transform: uppercase;
        }
        .win-white-text {
            font-size: 30px; font-weight: 950; color: #ffffff;
            text-shadow: 0 0 15px #ffffff, 0 0 10px #000;
        }

        .penalty-controls-box {
            width: 100%; max-width: 480px; background: rgba(0,0,0,0.9);
            padding: 12px; border-radius: 16px; border: 1px solid rgba(0,255,136,0.4); z-index: 25;
        }
        .bet-control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; }
        .bet-adjust-box { display: flex; align-items: center; gap: 6px; }
        .btn-bet-step { background: #ff4500; color: #fff; border: none; width: 32px; height: 32px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .bet-input-display { background: #0f1118; border: 1px solid #00ff88; color: #00ff88; padding: 5px 10px; border-radius: 6px; font-weight: 900; font-size: 14px; width: 80px; text-align: center; }
        .btn-confirmar-aposta { width: 100%; padding: 14px; background: linear-gradient(180deg, #00ff88 0%, #00cc6a 50%, #008f4b 100%); color: #000; border: 2px solid #a9dfbf; border-radius: 50px; font-weight: 950; font-size: 16px; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 255, 136, 0.7); text-transform: uppercase; }

        .bilhetes-container, .extrato-container, .suporte-container { padding: 15px; }
        .extrato-item { background: linear-gradient(145deg, #151821, #11141c); border: 1px solid #ff4500; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .modal-input { width: 100%; padding: 11px 14px; margin-bottom: 12px; background: #0f1118; border: 1px solid #2c3347; border-radius: 10px; color: white; font-size: 13px; }
        .modal-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff4500, #ff6a00); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://files.catbox.moe/qf2bly.jpeg" class="logo-img-pequena" alt="Logo">
        </div>
        <div class="header-right">
            <div class="saldo-topo-3d">💰 Saldo: R$ <span id="saldoAtual">1000.00</span></div>
        </div>
    </header>

    <div class="section-title" style="margin-top: 15px;">🏆 PENALTY SHOOT-OUT 3D</div>
    <div class="games-grid">
        <div class="game-card" onclick="abrirPenaltyFootball()">
            <img src="https://files.catbox.moe/75mifn.jpeg" class="game-img" alt="Penalty Shootout">
            <div class="game-name">⚽ JOGAR AGORA</div>
        </div>
    </div>

    <!-- JOGO PENALTY SHOOT-OUT 3D CORRIGIDO -->
    <div id="footballModal">
        <div class="penalty-header-top">
            <div>
                <div class="modal-title-football">⚽ PENALTY SHOOT-OUT 3D</div>
                <div id="subStatusJogo" style="font-size: 11px; color: #ffb703; font-weight: bold;">Escolha um canto na baliza para chutar!</div>
            </div>
            <span class="close-fullscreen" onclick="fecharPenaltyFootball()">&times;</span>
        </div>
        
        <!-- ESTÁDIO 3D COM BALIZA -->
        <div class="stadium-container-3d" id="stadiumContainer">
            <!-- A REDE DE FUTEBOL -->
            <div class="goal-frame"><div class="goal-net"></div></div>

            <!-- MULTIPLICADORES -->
            <div class="multipliers-bar">
                <div class="mult-badge" id="m1">1.92x</div>
                <div class="mult-badge" id="m2">3.84x</div>
                <div class="mult-badge" id="m3">7.68x</div>
                <div class="mult-badge" id="m4">15.36x</div>
                <div class="mult-badge" id="m5">30.72x</div>
            </div>

            <!-- GOLEIRO 3D (RENDERIZAÇÃO ANATÔMICA, SEM MÃOS REDONDAS) -->
            <div class="goleiro-real-3d" id="goleiroEl">
                <svg viewBox="0 0 150 200" width="100%" height="100%">
                    <defs>
                        <!-- Gradientes para dar efeito de volume 3D -->
                        <radialGradient id="body3d" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#3498db"/>
                            <stop offset="100%" stop-color="#154360"/>
                        </radialGradient>
                        <radialGradient id="skin3d" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#f5cba7"/>
                            <stop offset="100%" stop-color="#a04000"/>
                        </radialGradient>
                        <linearGradient id="glove3d" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="100%" stop-color="#7f8c8d"/>
                        </linearGradient>
                    </defs>
                    <!-- Cabeça e Rosto -->
                    <ellipse cx="75" cy="30" rx="16" ry="22" fill="url(#skin3d)" stroke="#222" stroke-width="1"/>
                    <path d="M57 25 Q75 -5 93 25 Q85 10 75 10 Q65 10 57 25 Z" fill="#111" />
                    <!-- Tronco (Camisa Esportiva) -->
                    <path d="M45 55 L105 55 L95 125 L55 125 Z" fill="url(#body3d)" stroke="#2980b9" stroke-width="2"/>
                    <!-- Braços musculosos (Posição de Defesa) -->
                    <path d="M48 58 L20 100 L32 110 L58 75 Z" fill="url(#body3d)" stroke="#2980b9" stroke-width="1.5"/>
                    <path d="M102 58 L130 100 L118 110 L92 75 Z" fill="url(#body3d)" stroke="#2980b9" stroke-width="1.5"/>
                    <!-- Luvas de Goleiro Profissional (Polígonos, não mais círculos) -->
                    <path d="M12 95 Q2 110 20 120 Q30 115 25 105 Z" fill="url(#glove3d)" stroke="#444" stroke-width="1"/>
                    <path d="M138 95 Q148 110 130 120 Q120 115 125 105 Z" fill="url(#glove3d)" stroke="#444" stroke-width="1"/>
                    <!-- Calção -->
                    <path d="M55 125 L95 125 L90 155 L77 145 L73 145 L60 155 Z" fill="#111"/>
                    <!-- Pernas/Meias -->
                    <rect x="62" y="150" width="8" height="35" fill="url(#skin3d)"/>
                    <rect x="80" y="150" width="8" height="35" fill="url(#skin3d)"/>
                    <path d="M57 185 L73 185 L75 195 L55 195 Z" fill="#eee"/>
                    <path d="M77 185 L93 185 L95 195 L75 195 Z" fill="#eee"/>
                </svg>
            </div>

            <!-- ALVOS NOS CANTOS DA BALIZA -->
            <div class="target-spot" id="target1" onclick="chutarPenalty(1)"><div class="target-inner-ball"></div></div>
            <div class="target-spot" id="target2" onclick="chutarPenalty(2)"><div class="target-inner-ball"></div></div>
            <div class="target-spot" id="target3" onclick="chutarPenalty(3)"><div class="target-inner-ball"></div></div>
            <div class="target-spot" id="target4" onclick="chutarPenalty(4)"><div class="target-inner-ball"></div></div>
            <div class="target-spot" id="target5" onclick="chutarPenalty(5)"><div class="target-inner-ball"></div></div>

            <!-- A ÚNICA BOLA DO JOGO -->
            <div class="bola-penalty-3d" id="bolaEl"></div>

            <!-- TELA DE VITÓRIA / GOL -->
            <div class="win-display-banner" id="winBanner">
                <div class="win-red-amount" id="winValorVermelho">R$ 20,00 virou</div>
                <div class="win-white-text" id="winValorBranco">R$ 38,40</div>
            </div>
        </div>

        <div class="penalty-controls-box">
            <div class="bet-control-row">
                <span>Valor da Aposta:</span>
                <div class="bet-adjust-box">
                    <button class="btn-bet-step" onclick="alterarAposta(-1)">-</button>
                    <input type="text" id="penaltyBetInput" class="bet-input-display" value="20.00" readonly>
                    <button class="btn-bet-step" onclick="alterarAposta(1)">+</button>
                </div>
            </div>
            <button class="btn-confirmar-aposta" id="btnConfirmarAposta" onclick="reiniciarRodada()">NOVO PÊNALTI</button>
        </div>
    </div>

    <script>
        let saldo = parseFloat(localStorage.getItem('cangaco_saldo')) || 1000.00;
        let nivelAtual = 0;
        const multiplicadores = [1.92, 3.84, 7.68, 15.36, 30.72];

        function atualizarSaldoNaTela() { document.getElementById('saldoAtual').innerText = saldo.toFixed(2); localStorage.setItem('cangaco_saldo', saldo); }
        atualizarSaldoNaTela();

        function abrirPenaltyFootball() { document.getElementById('footballModal').style.display = 'flex'; reiniciarRodada(); }
        function fecharPenaltyFootball() { document.getElementById('footballModal').style.display = 'none'; }

        function alterarAposta(delta) {
            let input = document.getElementById('penaltyBetInput');
            let val = parseFloat(input.value) + (delta * 10);
            if (val < 10) val = 10;
            input.value = val.toFixed(2);
        }

        function reiniciarRodada() {
            nivelAtual = 0;
            document.getElementById('winBanner').style.display = 'none';
            document.getElementById('bolaEl').style.transform = 'translateX(-50%) translateY(0) scale(1)';
            document.getElementById('goleiroEl').style.transform = 'translateX(-50%) translateY(0) rotate(0deg)';
            document.getElementById('subStatusJogo').innerText = "Escolha um canto na baliza para chutar!";
            atualizarMultiplicadoresUI();
            mostrarAlvos(true);
        }

        function atualizarMultiplicadoresUI() {
            for (let i = 1; i <= 5; i++) {
                let badge = document.getElementById('m' + i);
                badge.classList.remove('active');
                if (i - 1 === nivelAtual) badge.classList.add('active');
            }
        }

        function mostrarAlvos(status) {
            let displayVal = status ? 'flex' : 'none';
            for (let i = 1; i <= 5; i++) { document.getElementById('target' + i).style.display = displayVal; }
        }

        function chutarPenalty(cantoEscolhido) {
            mostrarAlvos(false);
            let apostaVal = parseFloat(document.getElementById('penaltyBetInput').value);
            
            if (nivelAtual === 0 && saldo < apostaVal) { alert("Saldo insuficiente!"); mostrarAlvos(true); return; }
            if (nivelAtual === 0) { saldo -= apostaVal; atualizarSaldoNaTela(); }

            document.getElementById('subStatusJogo').innerText = "A chutar...";

            let bola = document.getElementById('bolaEl');
            let goleiro = document.getElementById('goleiroEl');

            // Coordenas exatas de destino da bola
            let bolaMovimentos = {
                1: 'translate(calc(-50% - 130px), -240px) scale(0.65)',
                2: 'translate(calc(-50% + 130px), -240px) scale(0.65)',
                3: 'translate(-50%, -240px) scale(0.65)',
                4: 'translate(calc(-50% - 130px), -125px) scale(0.65)',
                5: 'translate(calc(-50% + 130px), -125px) scale(0.65)'
            };
            
            // Movimentos precisos de pulo do goleiro 3D
            let goleiroMovimentos = {
                1: 'translate(calc(-50% - 90px), -30px) rotate(-35deg)',
                2: 'translate(calc(-50% + 90px), -30px) rotate(35deg)',
                3: 'translate(-50%, -40px)',
                4: 'translate(calc(-50% - 100px), 30px) rotate(-55deg)',
                5: 'translate(calc(-50% + 100px), 30px) rotate(55deg)'
            };

            setTimeout(() => {
                bola.style.transform = bolaMovimentos[cantoEscolhido];
                goleiro.style.transform = goleiroMovimentos[cantoEscolhido];

                setTimeout(() => {
                    let goleiroDefendeu = Math.random() < 0.25 && nivelAtual > 1;

                    if (!goleiroDefendeu) {
                        let mult = multiplicadores[nivelAtual];
                        let premioTotal = apostaVal * mult;
                        
                        document.getElementById('winValorVermelho').innerText = `R$ ${apostaVal.toFixed(2)} virou`;
                        document.getElementById('winValorBranco').innerText = `R$ ${premioTotal.toFixed(2)}`;
                        document.getElementById('winBanner').style.display = 'block';

                        nivelAtual++;
                        if (nivelAtual >= 5) {
                            saldo += premioTotal; atualizarSaldoNaTela();
                            document.getElementById('subStatusJogo').innerText = "🎉 PARABÉNS! Completou todos os níveis!";
                        } else {
                            document.getElementById('subStatusJogo').innerText = `⚽ GOL! Escolha o próximo alvo!`;
                            setTimeout(() => {
                                document.getElementById('winBanner').style.display = 'none';
                                atualizarMultiplicadoresUI(); mostrarAlvos(true);
                                bola.style.transform = 'translateX(-50%) translateY(0) scale(1)';
                                goleiro.style.transform = 'translateX(-50%) translateY(0) rotate(0deg)';
                            }, 2500);
                        }
                    } else {
                        document.getElementById('subStatusJogo').innerText = "🧤 DEFESA DO GOLEIRO! Perdeu a aposta.";
                        document.getElementById('winValorVermelho').innerText = "DEFESA!";
                        document.getElementById('winValorBranco').innerText = "Tente de novo";
                        document.getElementById('winBanner').style.display = 'block';
                    }
                }, 400);
            }, 300);
        }
    </script>
</body>
</html>

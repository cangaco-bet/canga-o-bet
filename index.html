<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cangaço Bet - Fortune Tiger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .tiger-machine {
            background: linear-gradient(180deg, #181922, #0d0e13);
            border: 2px solid #ff4500;
            border-radius: 20px;
            padding: 25px 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 69, 0, 0.3);
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .btn-voltar {
            background: #2a2d3d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tiger-aposta-texto {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
        }
        .tiger-reels {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
            background: #111217;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #222;
        }
        .reel {
            font-size: 30px;
            background: #1c1d26;
            width: 75px;
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
        }
        .tiger-status {
            font-size: 13px;
            margin-bottom: 20px;
            color: #00ff88;
            min-height: 20px;
            font-weight: bold;
        }
        .btn-girar-tiger {
            background: linear-gradient(135deg, #ff5e00, #ff2600);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 69, 0, 0.6);
        }
        .btn-girar-tiger:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="tiger-machine">
        <div class="game-header">
            <button class="btn-voltar" onclick="alert('Voltando para o site...')">← Voltar</button>
            <div style="font-weight: bold; color: #ff4500;">🐅 FORTUNE TIGER</div>
            <div id="saldoJogo" style="color: #00ff88; font-weight: bold;">Saldo: R$ 99,50</div>
        </div>

        <div class="tiger-aposta-texto">Aposta: R$ 2,00</div>
        
        <div class="tiger-reels">
            <div class="reel" id="reel1">💰</div>
            <div class="reel" id="reel2">💰</div>
            <div class="reel" id="reel3">💰</div>
        </div>

        <div class="tiger-status" id="gameStatus">Você ganhou um prêmio baixo: R$ 1.50</div>

        <button class="btn-girar-tiger" onclick="girarTiger()">GIRAR 🐅</button>
        
        <div style="font-size: 11px; color: #666; margin-top: 15px;">Modo Oficial Cangaço Bet</div>
    </div>

    <script>
        let saldoVirtual = 99.50;

        function atualizarSaldo() {
            document.getElementById('saldoJogo').innerText = 'Saldo: R$ ' + saldoVirtual.toFixed(2).replace('.', ',');
        }

        function girarTiger() {
            if (saldoVirtual < 2.00) {
                alert('Saldo insuficiente!');
                return;
            }

            saldoVirtual -= 2.00;
            atualizarSaldo();

            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');
            const status = document.getElementById('gameStatus');

            status.style.color = "#ccc";
            status.innerText = "Girando...";
            r1.innerText = "🔄"; 
            r2.innerText = "🔄"; 
            r3.innerText = "🔄";

            setTimeout(() => {
                const icones = ["💰", "🍊", "🍋", "🍒", "⭐", "📜"];
                let chance = Math.random();

                if (chance < 0.85) {
                    // Derrota
                    r1.innerText = icones[Math.floor(Math.random() * icones.length)];
                    r2.innerText = icones[Math.floor(Math.random() * icones.length)];
                    r3.innerText = icones[Math.floor(Math.random() * icones.length)];
                    
                    status.style.color = "#ff4444";
                    status.innerText = "Não foi dessa vez! Tente novamente.";
                } else {
                    // Vitória com prêmio baixo igualzinho ao vídeo
                    let premio = 1.50;
                    r1.innerText = "💰";
                    r2.innerText = "💰";
                    r3.innerText = "💰";
                    
                    saldoVirtual += premio;
                    status.style.color = "#00ff88";
                    status.innerText = `Você ganhou um prêmio baixo: R$ ${premio.toFixed(2)}`;
                }
                atualizarSaldo();
            }, 800);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Tiger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #3b0000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .slot-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #600202 0%, #3b0000 60%, #1a0000 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 2px solid #ffcc00;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            font-size: 13px;
            color: #ffcc00;
            background: rgba(0, 0, 0, 0.2);
            font-weight: 500;
        }

        /* Topo do Tigre com o selo x10 */
        .tiger-header {
            text-align: center;
            position: relative;
            margin-top: 10px;
        }
        .multiplier-badge {
            display: inline-block;
            background: #ffcc00;
            color: #8b0000;
            font-weight: 900;
            font-size: 20px;
            padding: 4px 18px;
            border-radius: 25px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }
        .tiger-icon-box {
            font-size: 35px;
            margin-top: -12px;
            position: relative;
            z-index: 1;
        }

        /* Estrutura dos Rolos Exata do Print */
        .machine-frame {
            background: #7a0505;
            margin: 0 15px;
            padding: 14px;
            border-radius: 16px;
            border: 3px solid #ffcc00;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.7);
        }
        .tiger-reels {
            display: flex;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
        }
        .reel {
            font-size: 42px;
            background: #fcfcfc;
            width: 95px;
            height: 105px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.25);
            transition: transform 0.1s ease-in-out;
        }

        /* Animação de Giro */
        @keyframes tremer {
            0% { transform: translateY(0); }
            25% { transform: translateY(-5px); }
            50% { transform: translateY(5px); }
            75% { transform: translateY(-3px); }
            100% { transform: translateY(0); }
        }
        .girando {
            animation: tremer 0.15s infinite;
        }

        .game-message {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 1px 1px 3px #000;
            min-height: 30px;
            margin: 5px 0;
        }

        /* Painel Inferior Identico */
        .bottom-panel {
            background: rgba(0, 0, 0, 0.65);
            padding: 15px;
            border-top: 2px solid #ffcc00;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            background: #2b0000;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #ffcc00;
            font-size: 12px;
        }
        .stat-box span {
            display: block;
            font-size: 10px;
            color: #ccc;
            text-transform: uppercase;
        }
        .stat-box strong {
            color: #00ff88;
            font-size: 13px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-side {
            background: #7a0505;
            color: #fff;
            border: 2px solid #ffcc00;
            padding: 10px 12px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 10px;
            cursor: pointer;
        }
        .btn-girar-tiger {
            background: radial-gradient(circle, #00ff88 0%, #008844 100%);
            color: white;
            border: 4px solid #ffcc00;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 2px #000;
        }
        .btn-girar-tiger:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Música de fundo integrada -->
    <audio id="bgMusic" src="https://files.catbox.moe/4plmor.mp3" loop></audio>

    <div class="slot-container" onclick="ativarAudio()">
        <!-- Topo da Tela com Relógio Exato -->
        <div class="top-bar">
            <span>Fortune Tiger</span>
            <span id="relogio">01:31:49</span>
        </div>

        <!-- Cabeçalho do Tigre com o Multiplicador x10 -->
        <div class="tiger-header">
            <div class="multiplier-badge">x10</div>
            <div class="tiger-icon-box">🐯</div>
        </div>

        <!-- Rolos do Jogo -->
        <div class="machine-frame">
            <div class="tiger-reels">
                <div class="reel" id="reel1">💰</div>
                <div class="reel" id="reel2">🍊</div>
                <div class="reel" id="reel3">🍋</div>
            </div>
        </div>

        <!-- Mensagem de Status -->
        <div class="game-message" id="gameStatus">Tente novamente!</div>

        <!-- Painel Inferior de Estatísticas e Botões -->
        <div class="bottom-panel">
            <div class="stats-row">
                <div class="stat-box">
                    <span>Saldo</span>
                    <strong id="saldoJogo">R$ 97,00</strong>
                </div>
                <div class="stat-box">
                    <span>Aposta</span>
                    <strong style="color: #ffcc00;">R$ 2,00</strong>
                </div>
                <div class="stat-box">
                    <span>Ganho</span>
                    <strong id="ganhoJogo" style="color: #00ff88;">R$ 0,00</strong>
                </div>
            </div>

            <div class="controls-row">
                <button class="btn-side">⚡<br>TURBO</button>
                <button class="btn-girar-tiger" onclick="girarTiger(event)">
                    🐯<span style="font-size: 10px;">GIRAR</span>
                </button>
                <button class="btn-side">🔄<br>AUTO</button>
            </div>
        </div>
    </div>

    <script>
        // Relógio sincronizado com o print
        setInterval(() => {
            const agora = new Date();
            document.getElementById('relogio').innerText = agora.toTimeString().split(' ')[0];
        }, 1000);

        let audioAtivo = false;
        function ativarAudio() {
            if (!audioAtivo) {
                const music = document.getElementById('bgMusic');
                music.play().catch(e => console.log(e));
                audioAtivo = true;
            }
        }

        let saldo = 97.00;

        function atualizarUI() {
            document.getElementById('saldoJogo').innerText = 'R$ ' + saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        }

        function girarTiger(event) {
            event.stopPropagation();
            ativarAudio();

            if (saldo < 2.00) {
                alert('Saldo insuficiente!');
                return;
            }

            saldo -= 2.00;
            atualizarUI();

            const r1 = document.getElementById('reel1');
            const r2 = document.getElementById('reel2');
            const r3 = document.getElementById('reel3');
            const status = document.getElementById('gameStatus');
            const ganhoEl = document.getElementById('ganhoJogo');

            status.innerText = "Girando...";
            ganhoEl.innerText = "R$ 0,00";

            // Adiciona animação de trepidação nos rolos
            r1.classList.add('girando');
            r2.classList.add('girando');
            r3.classList.add('girando');

            setTimeout(() => {
                r1.classList.remove('girando');
                r2.classList.remove('girando');
                r3.classList.remove('girando');

                const simbolos = ["💰", "🍊", "🍋", "🧧", "⭐"];
                let chance = Math.random();

                if (chance < 0.75) {
                    r1.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    r2.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    r3.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                    status.innerText = "Tente novamente!";
                } else {
                    r1.innerText = "💰";
                    r2.innerText = "💰";
                    r3.innerText = "💰";
                    let premio = 10.00;
                    saldo += premio;
                    ganhoEl.innerText = "R$ " + premio.toFixed(2);
                    status.innerText = "Funcionalidade Tigre da Sorte!";
                }
                atualizarUI();
            }, 900);
        }
    </script>
</body>
</html>

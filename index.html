<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cangaço Bet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f1015; color: #ffffff; padding-bottom: 80px; }
        header { background: linear-gradient(135deg, #1a1c23, #0f1015); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff4500; }
        .logo { font-size: 20px; font-weight: bold; color: #ff4500; }
        
        .main-tab-content { display: none; }
        .main-tab-content.active-tab { display: block; }

        .sports-container { padding: 15px; }
        .match-card { background: #1a1c23; border: 1px solid #2a2d3d; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .match-header { display: flex; justify-content: space-between; font-size: 11px; color: #ffb703; margin-bottom: 8px; font-weight: bold; text-transform: uppercase; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; margin-bottom: 12px; }
        .team-name { width: 40%; text-align: center; }
        .match-vs { font-size: 11px; color: #888; background: #13141b; padding: 4px 8px; border-radius: 20px; }
        .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .odd-btn { background: #252836; border: 1px solid #363a4f; padding: 8px 4px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .odd-btn:hover, .odd-btn.selected { background: #ff4500; border-color: #ffb703; color: white; }
        .odd-label { font-size: 10px; color: #aaa; display: block; }
        .odd-value { font-size: 13px; font-weight: bold; color: #fff; display: block; margin-top: 2px; }

        /* Estilos do Casino */
        .casino-container { padding: 15px; text-align: center; }
        .slot-machine { background: linear-gradient(180deg, #2b1d1d, #120909); border: 3px solid #ffb703; border-radius: 16px; padding: 15px; max-width: 350px; margin: 0 auto; box-shadow: 0 0 20px rgba(255,183,3,0.3); }
        .slot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #fff; padding: 10px; border-radius: 10px; margin-bottom: 15px; }
        .slot-item { background: #f9f9f9; border: 1px solid #ddd; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 28px; border-radius: 6px; }
        .btn-girar { background: linear-gradient(135deg, #ff4500, #ffb703); color: #000; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 900; cursor: pointer; }

        /* Boletim de Apostas Flutuante */
        .bet-slip { position: fixed; bottom: 65px; left: 15px; right: 15px; background: #1e2029; border: 2px solid #ff4500; border-radius: 12px; padding: 12px; display: none; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); z-index: 998; }
        .bet-slip-title { font-size: 12px; font-weight: bold; color: #ffb703; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .bet-slip-info { font-size: 13px; margin-bottom: 8px; color: #ddd; }
        .bet-slip-input { width: 100%; padding: 8px; background: #13141b; border: 1px solid #363a4f; color: white; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .btn-place-bet { width: 100%; background: #00ff88; color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: 900; font-size: 13px; cursor: pointer; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #13141b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; z-index: 99; }
        .nav-item { text-align: center; color: #888; font-size: 11px; text-decoration: none; cursor: pointer; }
        .nav-item.active { color: #ff4500; }
    </style>
</head>
<body>

    <div id="tab-esportes" class="main-tab-content active-tab">
        <header>
            <div class="logo">⚽ CANGAÇO ESPORTES</div>
            <div style="font-size: 13px; font-weight: bold; color: #ffcc00;">Saldo: R$ <span id="saldoGeralUI">9.250,00</span></div>
        </header>

        <div class="sports-container">
            <div style="font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #ffb703;">🔥 Partidas Reais ao Vivo / Hoje</div>
            
            <div id="lista-partidas-api">
                <p style="color: #888; text-align: center; padding: 20px;">A carregar partidas reais e odds da API...</p>
            </div>
        </div>
    </div>

    <div id="tab-cassino" class="main-tab-content">
        <header>
            <div class="logo">🎰 CANGAÇO CASSINO</div>
            <div style="font-size: 13px; font-weight: bold; color: #ffcc00;">Saldo: R$ <span id="saldoCassinoUI">9.250,00</span></div>
        </header>

        <div class="casino-container">
            <div class="slot-machine">
                <div style="font-size: 13px; font-weight: bold; color: #ffb703; margin-bottom: 8px;">TIGER FORTUNE</div>
                <div class="slot-grid" id="slotGrid">
                    <div class="slot-item">🍊</div>
                    <div class="slot-item">🏆</div>
                    <div class="slot-item">🏆</div>
                    <div class="slot-item">🍊</div>
                    <div class="slot-item">💰</div>
                    <div class="slot-item">🧧</div>
                    <div class="slot-item">💰</div>
                    <div class="slot-item">🍋</div>
                    <div class="slot-item">🏆</div>
                </div>
                <div style="margin-bottom: 10px; text-align: left;">
                    <span style="font-size: 11px; color: #aaa;">Aposta (R$):</span>
                    <input type="number" id="slotApostaInput" value="250" style="width: 100%; padding: 6px; background: #13141b; border: 1px solid #444; color: #fff; border-radius: 4px; margin-top: 3px;">
                </div>
                <button class="btn-girar" onclick="girarSlot()">GIRAR</button>
                <div id="slotMensagem" style="margin-top: 10px; font-size: 13px; font-weight: bold; color: #00ff88;"></div>
            </div>
        </div>
    </div>

    <div class="bet-slip" id="betSlip">
        <div class="bet-slip-title">
            <span>🎟️ BILHETE DE APOSTA</span>
            <span style="cursor:pointer;" onclick="fecharBilhete()">&times;</span>
        </div>
        <div class="bet-slip-info" id="betSelectionInfo">Seleção: -</div>
        <input type="number" id="betValorInput" class="bet-slip-input" placeholder="Valor da Aposta (R$)" value="50">
        <div style="font-size: 11px; color: #00ff88; margin-bottom: 6px;" id="retornoPotencial">Retorno potencial: R$ 0,00</div>
        <button class="btn-place-bet" onclick="confirmarApostaEsportiva()">CONFIRMAR APOSTA</button>
    </div>

    <nav>
        <a class="nav-item" id="navCassinoBtn" onclick="mudarAba('cassino')">🎰<br>Cassino</a>
        <a class="nav-item active" id="navEsportesBtn" onclick="mudarAba('esportes')">⚽<br>Esportes</a>
    </nav>

    <script>
        let saldo = 9250.00;
        let apostaSelecionada = null;
        let oddAtual = 0;
        const apiKey = '26203b2595a3fc5f4bdc92a2e768e757'; // Chave API inserida com sucesso

        function mudarAba(aba) {
            document.querySelectorAll('.main-tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (aba === 'esportes') {
                document.getElementById('tab-esportes').classList.add('active-tab');
                document.getElementById('navEsportesBtn').classList.add('active');
            } else if (aba === 'cassino') {
                document.getElementById('tab-cassino').classList.add('active-tab');
                document.getElementById('navCassinoBtn').classList.add('active');
            }
        }

        function atualizarSaldosUI() {
            document.getElementById('saldoGeralUI').innerText = saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById('saldoCassinoUI').innerText = saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        }

        // Função para puxar partidas reais via API
        async function carregarJogosReais() {
            const container = document.getElementById('lista-partidas-api');
            try {
                const hoje = new Date().toISOString().split('T')[0];
                const resposta = await fetch(`https://v3.football.api-sports.io/fixtures?date=${hoje}`, {
                    headers: {
                        "x-apisports-key": apiKey
                    }
                });
                const dados = await resposta.json();

                if (dados.response && dados.response.length > 0) {
                    container.innerHTML = '';
                    
                    // Exibe até 10 partidas reais do dia
                    dados.response.slice(0, 10).forEach(match => {
                        const casa = match.teams.home.name;
                        const fora = match.teams.away.name;
                        const liga = match.league.name;
                        const statusHora = match.fixture.status.short === 'LIVE' ? `<span style="color: #00ff88;">● ${match.fixture.status.elapsed}'</span>` : match.fixture.date.split('T')[1].substring(0,5);

                        const card = document.createElement('div');
                        card.className = 'match-card';
                        card.innerHTML = `
                            <div class="match-header"><span>${liga}</span> <span>${statusHora}</span></div>
                            <div class="match-teams">
                                <span class="team-name">${casa}</span>
                                <span class="match-vs">VS</span>
                                <span class="team-name">${fora}</span>
                            </div>
                            <div class="odds-grid">
                                <div class="odd-btn" onclick="selecionarAposta('${casa} x ${fora} (Casa)', 1.85, this)">
                                    <span class="odd-label">1 (Casa)</span>
                                    <span class="odd-value">1.85</span>
                                </div>
                                <div class="odd-btn" onclick="selecionarAposta('${casa} x ${fora} (Empate)', 3.40, this)">
                                    <span class="odd-label">X (Empate)</span>
                                    <span class="odd-value">3.40</span>
                                </div>
                                <div class="odd-btn" onclick="selecionarAposta('${casa} x ${fora} (Fora)', 3.90, this)">
                                    <span class="odd-label">2 (Fora)</span>
                                    <span class="odd-value">3.90</span>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="color: #aaa; text-align: center; padding: 20px;">Sem partidas oficiais encontradas para o dia de hoje.</p>`;
                }
            } catch (erro) {
                console.error("Erro ao puxar dados:", erro);
                container.innerHTML = `<p style="color: #ff4500; text-align: center; padding: 20px;">Erro ao ligar à API de futebol.</p>`;
            }
        }

        function selecionarAposta(jogoOdd, odd, elemento) {
            document.querySelectorAll('.odd-btn').forEach(b => b.classList.remove('selected'));
            elemento.classList.add('selected');
            apostaSelecionada = jogoOdd;
            oddAtual = odd;
            document.getElementById('betSelectionInfo').innerText = `Seleção: ${jogoOdd} (Odd: ${odd})`;
            document.getElementById('betSlip').style.display = 'block';
            atualizarRetornoPotencial();
        }

        function fecharBilhete() {
            document.getElementById('betSlip').style.display = 'none';
            document.querySelectorAll('.odd-btn').forEach(b => b.classList.remove('selected'));
        }

        document.getElementById('betValorInput').addEventListener('input', atualizarRetornoPotencial);

        function atualizarRetornoPotencial() {
            let valor = parseFloat(document.getElementById('betValorInput').value) || 0;
            let retorno = valor * oddAtual;
            document.getElementById('retornoPotencial').innerText = `Retorno potencial: R$ ${retorno.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }

        function confirmarApostaEsportiva() {
            let valor = parseFloat(document.getElementById('betValorInput').value) || 0;
            if (valor <= 0 || saldo < valor) {
                alert('Valor inválido ou saldo insuficiente!');
                return;
            }
            saldo -= valor;
            atualizarSaldosUI();
            fecharBilhete();
            alert(`✅ Aposta registada com sucesso em "${apostaSelecionada}" no valor de R$ ${valor.toFixed(2)}!`);
        }

        function girarSlot() {
            let valorAposta = parseFloat(document.getElementById('slotApostaInput').value) || 0;
            if (valorAposta <= 0 || saldo < valorAposta) {
                alert('Saldo insuficiente para jogar no cassino!');
                return;
            }

            saldo -= valorAposta;
            atualizarSaldosUI();

            const simbolos = ['🍊', '🏆', '💰', '🧧', '🍋', '⭐', '💎'];
            const gridItems = document.querySelectorAll('.slot-item');
            
            gridItems.forEach(item => {
                const randomSymbol = simbolos[Math.floor(Math.random() * simbolos.length)];
                item.innerText = randomSymbol;
            });

            // Lógica simples de sorteio aleatório
            if (Math.random() > 0.6) {
                let premio = valorAposta * 3;
                saldo += premio;
                atualizarSaldosUI();
                document.getElementById('slotMensagem').innerText = `🎉 Ganhou R$ ${premio.toFixed(2)}!`;
            } else {
                document.getElementById('slotMensagem').innerText = `Tente novamente!`;
            }
        }

        window.onload = carregarJogosReais;
    </script>
</body>
</html>

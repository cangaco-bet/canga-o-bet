<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cangaço Bet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            padding-bottom: 25px;
        }

        /* TELA DE ABERTURA (SPLASH SCREEN 4D) */
        #splashScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a101f 0%, #0b0c10 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        .splash-banner {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4500;
            box-shadow: 0 0 35px rgba(255, 69, 0, 0.8);
            animation: float4D 3s ease-in-out infinite;
            margin-bottom: 25px;
        }
        @keyframes float4D {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-15px) rotate(4deg) scale(1.06); filter: drop-shadow(0 20px 30px rgba(255,183,3,0.6)); }
            100% { transform: translateY(0px) rotate(0deg) scale(1); }
        }
        .loading-container {
            width: 260px;
            background: #151821;
            border: 1px solid #2c3347;
            border-radius: 20px;
            overflow: hidden;
            height: 14px;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }
        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ffb703);
            border-radius: 20px;
            transition: width 0.1s linear;
        }
        .loading-text {
            font-size: 13px;
            font-weight: bold;
            color: #ffb703;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .btn-entrar-splash {
            display: none;
            background: linear-gradient(135deg, #ff4500, #ff6a00);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 69, 0, 0.6);
            animation: pulseBtn 1.5s infinite;
        }
        @keyframes pulseBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        header {
            background: linear-gradient(135deg, #151821, #0b0c10);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff4500;
            position: sticky;
            top: 0;
            z-index: 90;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-menu-lateral {
            background: #191d28;
            border: 1px solid #ff4500;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.3);
        }
        .btn-menu-lateral span {
            width: 18px;
            height: 2px;
            background-color: #ff4500;
            border-radius: 2px;
        }

        .logo-img-pequena {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #ffb703;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 183, 3, 0.6);
        }

        .saldo-topo-3d {
            background: linear-gradient(145deg, #1f2430, #13161f);
            border: 1px solid #ffb703;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            color: #ffb703;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), 0 4px 12px rgba(255, 183, 3, 0.2);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .saldo-topo-3d span { color: #fff; }

        .btn-topo-acao {
            background: linear-gradient(135deg, #ff4500, #cc3500);
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.4);
        }
        .btn-topo-login {
            background: transparent;
            color: #ffb703;
            border: 1px solid #ffb703;
            padding: 7px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .quick-search-bar {
            padding: 12px 15px;
            background: #0f1118;
            border-bottom: 1px solid #1a1d28;
        }
        .quick-search-input {
            width: 100%;
            padding: 10px 15px;
            background: #151821;
            border: 1px solid #232838;
            border-radius: 20px;
            color: white;
            font-size: 13px;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(3px);
            z-index: 998;
        }

            position: fixed;
            top: 0; left: -280px; width: 280px; height: 100%;
            background: linear-gradient(180deg, #151821

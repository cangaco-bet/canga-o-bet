<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cangaço Bet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f1015;
            color: #ffffff;
            padding-bottom: 80px;
        }
        header {
            background: linear-gradient(135deg, #1a1c23, #0f1015);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff4500;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff4500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-entrar {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .player-bar {
            background: #1e2029;
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #2a2d3d;
        }
        .player-info {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-info audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }
        audio::-webkit-media-controls-panel {
            background-color: #2a2d3d;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 0 15px;
            overflow-x: auto;
            margin-bottom: 20px;
        }
        .category-pill {
            background: #1e2029;
            border: 1px solid #2a2d3d;
            padding: 8px 16px;
            border-radius: 20px;
            color: #ccc;
            font-size: 13px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-title {
            padding: 0 15px;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 0 15px;
        }
        .game-card {
            background: #1e2029;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2a2d3d;
            text-align: center;
        }
        .game-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }
        .game-name {
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #13141b;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222;
        }
        .nav-item {
            text-align: center;
            color: #888;
            font-size: 11px;
            text-decoration: none;
        }
        .nav-item.active {
            color: #ff4500;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🔥 CANGAÇO BET</div>
        <button class="btn-entrar">ENTRAR</button>
    </header>

    <!-- Leitor de Música embutido no site -->
    <div class="player-bar">
        <div class="player-info">
            <span>🎵</span>
            <div style="width: 100%;">
                <div style="font-weight: bold; margin-bottom: 4px;">Famoso Ímã | O Poderoso Chatão</div>
                <div style="font-size: 12px; color: #aaa; margin-bottom: 8px;">MC Lele JP, Poze do Rodo</div>
                <!-- O ficheiro de áudio deve estar guardado no mesmo repositório com o nome abaixo -->
                <audio controls preload="none">
                    <source src="FAMOSO ÍMA   O PODEROSO CHATÃO - MC's Lele JP,  Poze do Rodo e Leozinho ZS (DJ Gordinho da VF) - MC Lele JP.mp3" type="audio/mp3">
                    O seu navegador não suporta áudio.
                </audio>
            </div>
        </div>
    </div>

    <div class="categories">
        <div class="category-pill">🤠 Cangaço torneios</div>
        <div class="category-pill">🌵 Cangaço missões</div>
        <div class="category-pill">🔥 Top</div>
    </div>

    <div class="section-title">🏆 TOP</div>

    <div class="games-grid">
        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=300" class="game-img" alt="Fortune Tiger">
            <div class="game-name">Fortune Tiger</div>
        </div>
        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1508614589041-895b88991e3e?w=300" class="game-img" alt="Aviator">
            <div class="game-name">Aviator</div>
        </div>
        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300" class="game-img" alt="Big Bass">
            <div class="game-name">Big Bass Bonanza</div>
        </div>
        <div class="game-card">
            <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=300" class="game-img" alt="Gates of Olympus">
            <div class="game-name">Gates of Olympus</div>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-item">📁<br>Registrar</a>
        <a href="#" class="nav-item">📂<br>Categorias</a>
        <a href="#" class="nav-item active">💰<br>Cangaço</a>
        <a href="#" class="nav-item">📺<br>Ao Vivo</a>
        <a href="#" class="nav-item">🔍<br>Pesquisar</a>
    </nav>
</body>
</html>

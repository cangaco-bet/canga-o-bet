<!-- Exemplo de estrutura para o card de partida com escudos -->
<div class="match-card">
  <div class="team home">
    <img src="https://media.api-sports.io/football/teams/{team_id}.png" alt="Escudo Mandante" class="team-logo">
    <span>Nome do Time Casa</span>
  </div>
  <div class="match-score">
    <span class="live-clock">45:12</span> <!-- Relógio em tempo real -->
    <strong>2 x 1</strong>
  </div>
  <div class="team away">
    <span>Nome do Time Visitante</span>
    <img src="https://media.api-sports.io/football/teams/{team_id}.png" alt="Escudo Visitante" class="team-logo">
  </div>
</div>
